name: Build Mars (Windows)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Setup NuGet
      uses: NuGet/setup-nuget@v1

    - name: Restore NuGet packages
      run: nuget restore Mars/Mars.csproj -PackagesDirectory packages

    - name: Build Solution
      run: msbuild Mars/Mars.csproj /p:Configuration=Release /p:Platform="x64"

    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Mars-Executable
        path: Mars/bin/x64/Release/
